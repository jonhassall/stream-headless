services:
  stream:
    build: ./app
    image: stream-headless:local
    restart: unless-stopped
    env_file: .env
    volumes:
      - browser-data:/home/streamer/.config/chromium
    shm_size: "1gb"
    device_cgroup_rules:
      - "c 226:* rmw"
    ports:
      - "${CONTROL_BIND:-0.0.0.0}:${CONTROL_PORT:-6080}:6080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/stream-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  browser-data:
